%YAML 1.1
%TAG ! tag:stsci.edu:asdf/
---
!<tag:stsci.edu:gwcs/wcs-1.4.0>
name: roman_test
pixel_shape: [20, 30]
steps:
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/frame2d-1.2.0>
      axes_names: [x, y]
      axes_order: [0, 1]
      axis_physical_types: ["custom:x", "custom:y"]
      name: detector
      unit:
        - !unit/unit-1.0.0 pixel
        - !unit/unit-1.0.0 pixel
    transform: !transform/compose-1.4.0
      bounding_box: !transform/property/bounding_box-1.2.0
        ignore: []
        intervals:
          x0: [-0.5, 19.5]
          x1: [-0.5, 29.5]
        order: F
      forward:
        - !transform/concatenate-1.4.0
          forward:
            - !transform/shift-1.4.0 {offset: -10.0}
            - !transform/shift-1.4.0 {offset: -20.0}
        - !transform/compose-1.4.0
          forward:
            - !transform/remap_axes-1.5.0 {mapping: [0, 1, 0, 1]}
            - !transform/concatenate-1.4.0
              forward:
                - !transform/polynomial-1.3.0
                  coefficients:
                    - [0.0, 0.0]
                    - [1.0, 0.0]
                - !transform/polynomial-1.3.0
                  coefficients:
                    - [0.0, 1.0]
                    - [0.0, 0.0]
      inverse: !transform/concatenate-1.4.0
        forward:
          - !transform/shift-1.4.0 {offset: 10.0}
          - !transform/shift-1.4.0 {offset: 20.0}
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/frame2d-1.2.0>
      axes_names: [v2, v3]
      axes_order: [0, 1]
      axis_physical_types: ["custom:v2", "custom:v3"]
      name: v2v3
      unit:
        - !unit/unit-1.0.0 deg
        - !unit/unit-1.0.0 deg
    transform: !transform/concatenate-1.4.0
      forward:
        - !transform/scale-1.4.0 {factor: 1.0}
        - !transform/scale-1.4.0 {factor: 1.0}
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/frame2d-1.2.0>
      axes_names: [v2, v3]
      axes_order: [0, 1]
      axis_physical_types: ["custom:v2", "custom:v3"]
      name: v2v3vacorr
      unit:
        - !unit/unit-1.0.0 deg
        - !unit/unit-1.0.0 deg
    transform: !transform/compose-1.4.0
      forward:
        - !<tag:stsci.edu:gwcs/spherical_cartesian-1.3.0>
          transform_type: spherical_to_cartesian
          wrap_lon_at: 180
        - !transform/rotate_sequence_3d-1.2.0
          angles: [0.0]
          axes_order: z
          rotation_type: cartesian
        - !<tag:stsci.edu:gwcs/spherical_cartesian-1.3.0>
          transform_type: cartesian_to_spherical
          wrap_lon_at: 360
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/celestial_frame-1.2.0>
      axes_names: [lon, lat]
      axes_order: [0, 1]
      axis_physical_types: [pos.eq.ra, pos.eq.dec]
      name: world
      reference_frame: !<tag:astropy.org:astropy/coordinates/frames/icrs-1.1.0>
        frame_attributes: {}
      unit:
        - !unit/unit-1.0.0 deg
        - !unit/unit-1.0.0 deg
    transform: null
...
