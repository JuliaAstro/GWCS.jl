%YAML 1.1
%TAG ! tag:stsci.edu:asdf/
---
!<tag:stsci.edu:gwcs/wcs-1.4.0>
name: asdf_parser_test
pixel_shape: null
steps:
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/frame2d-1.2.0>
      axes_names: [x, y]
      axes_order: [0, 1]
      axis_physical_types: ["custom:x", "custom:y"]
      name: detector
      unit:
        - !unit/unit-1.0.0 pixel
        - !unit/unit-1.0.0 pixel
    transform: !transform/compose-1.4.0
      forward:
        - !transform/compose-1.4.0
          forward:
            - !transform/affine-1.5.0
              inputs: [x, y]
              matrix: !core/ndarray-1.1.0
                data:
                  - [0.01, 0.002]
                  - [-0.001, 0.02]
                datatype: float64
                shape: [2, 2]
              outputs: [x, y]
              translation: !core/ndarray-1.1.0
                data: [0.1, -0.2]
                datatype: float64
                shape: [2]
            - !transform/gnomonic-1.4.0
              direction: pix2sky
              inputs: [x, y]
              outputs: [phi, theta]
          inputs: [x, y]
          outputs: [phi, theta]
        - !transform/rotate3d-1.5.0
          direction: native2celestial
          inputs: [phi_N, theta_N]
          outputs: [alpha_C, delta_C]
          phi: 83.8221
          psi: 180.0
          theta: -5.3911
      inputs: [x, y]
      outputs: [alpha_C, delta_C]
  - !<tag:stsci.edu:gwcs/step-1.3.0>
    frame: !<tag:stsci.edu:gwcs/celestial_frame-1.2.0>
      axes_names: [lon, lat]
      axes_order: [0, 1]
      axis_physical_types: [pos.eq.ra, pos.eq.dec]
      name: world
      reference_frame: !<tag:astropy.org:astropy/coordinates/frames/icrs-1.1.0>
        frame_attributes: {}
      unit:
        - !unit/unit-1.0.0 deg
        - !unit/unit-1.0.0 deg
    transform: null
...
