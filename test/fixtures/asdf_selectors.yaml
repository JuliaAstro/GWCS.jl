array: !<tag:stsci.edu:gwcs/regions_selector-1.2.0>
  inputs: [x, y]
  outputs: [u, v]
  label_mapper: !<tag:stsci.edu:gwcs/label_mapper-1.2.0>
    mapper: [[0, 2], [1, 0]]
    no_label: 0
  selector:
    labels: [1, 2]
    transforms:
      - !<tag:stsci.edu:asdf/transform/concatenate-1.3.0>
        forward:
          - !<tag:stsci.edu:asdf/transform/shift-1.4.0> {offset: 1.0}
          - !<tag:stsci.edu:asdf/transform/scale-1.4.0> {factor: 1.0}
      - !<tag:stsci.edu:asdf/transform/concatenate-1.3.0>
        forward:
          - !<tag:stsci.edu:asdf/transform/shift-1.4.0> {offset: 2.0}
          - !<tag:stsci.edu:asdf/transform/scale-1.4.0> {factor: 2.0}
  undefined_transform_value: -100

dictionary: !<tag:stsci.edu:gwcs/regions_selector-1.2.0>
  inputs: [x, y]
  outputs: [u]
  label_mapper: !<tag:stsci.edu:gwcs/label_mapper-1.2.0>
    inputs: [x, y]
    inputs_mapping: !<tag:stsci.edu:asdf/transform/remap_axes-1.3.0>
      mapping: [0]
      n_inputs: 2
    atol: 0.001
    mapper:
      labels: [-2.0, 3.0]
      models:
        - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 1.0, dimensions: 2}
        - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 2.0, dimensions: 2}
  selector:
    labels: [1.0, 2.0]
    transforms:
      - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 10.0, dimensions: 2}
      - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 20.0, dimensions: 2}

range: !<tag:stsci.edu:gwcs/regions_selector-1.2.0>
  inputs: [x, y]
  outputs: [u]
  label_mapper: !<tag:stsci.edu:gwcs/label_mapper-1.2.0>
    inputs: [x, y]
    inputs_mapping: !<tag:stsci.edu:asdf/transform/remap_axes-1.3.0>
      mapping: [0]
      n_inputs: 2
    mapper:
      labels: [[0.0, 2.0], [2.0, 4.0]]
      models:
        - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 1.0, dimensions: 2}
        - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 2.0, dimensions: 2}
  selector:
    labels: [1.0, 2.0]
    transforms:
      - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 10.0, dimensions: 2}
      - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 20.0, dimensions: 2}

transform: !<tag:stsci.edu:gwcs/regions_selector-1.2.0>
  inputs: [x, y]
  outputs: [u]
  label_mapper: !<tag:stsci.edu:gwcs/label_mapper-1.2.0>
    inputs: [x, y]
    mapper: !<tag:stsci.edu:asdf/transform/constant-1.6.0>
      value: 1
      dimensions: 2
    no_label: 0
  selector:
    labels: [1]
    transforms:
      - !<tag:stsci.edu:asdf/transform/constant-1.6.0> {value: 10.0, dimensions: 2}
